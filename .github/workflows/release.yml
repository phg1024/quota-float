name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Test
        run: scripts/test.sh
      - name: Build app
        run: scripts/build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="QuotaFloat-$(cat VERSION).zip"
          (cd build && shasum -a 256 "$zip" > "$zip.sha256")
          # Re-pushing a tag replaces the assets of the existing release.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "build/$zip" "build/$zip.sha256" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "build/$zip" "build/$zip.sha256" --title "Quota Float $(cat VERSION)" --generate-notes
          fi
